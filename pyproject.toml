[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tieout"
version = "0.1.0.dev0"
description = "Open-source reconciliation engine: match bank, payment-provider, ledger and invoice records, with every match explained."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vinay K Rajith" }]
keywords = ["reconciliation", "finance", "accounting", "camt.053", "stripe", "ledger"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Typing :: Typed",
]
dependencies = [
  "click>=8.1",
  "defusedxml>=0.7.1",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/Vinay-K-Rajith/tieout"
Issues = "https://github.com/Vinay-K-Rajith/tieout/issues"

[project.scripts]
tieout = "tieout.cli:main"

[dependency-groups]
dev = [
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tieout"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "RUF",      # ruff-specific
  "PT",       # pytest style
  "DTZ",      # naive datetimes are a classic finance bug
  "PL",       # pylint subset
]
ignore = [
  "PLR0913",  # explicit keyword arguments beat bundling into config objects
  "PLR2004",  # magic values are fine in tests and format specs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["defusedxml.*"]
ignore_missing_imports = true
